services:
  backend:
    environment:
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?set BACKEND_CORS_ORIGINS}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?set TRUSTED_HOSTS}
      SERVER_HOST: ${SERVER_HOST:?set SERVER_HOST}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?set WS_ALLOWED_ORIGINS}

  worker:
    environment:
      SERVER_HOST: ${SERVER_HOST:?set SERVER_HOST}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?set NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED:-false}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?set NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED:-false}

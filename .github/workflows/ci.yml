name: Template CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:
    inputs:
      mobile_android_release:
        description: "Run signed Android release validation"
        required: false
        default: "false"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate documentation
        run: python3 scripts/validate_documentation.py
      - name: Validate requirements traceability
        run: python3 scripts/validate_requirements_traceability.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Run backend lint
        run: uv run ruff check src tests
      - name: Run backend tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Sync backend dependencies for OpenAPI export
        run: uv sync --group dev
        working-directory: backend
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Export OpenAPI contract
        run: npm run contracts:export
      - name: Check OpenAPI compatibility
        run: npm run contracts:check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  runtime:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    env:
      BACKEND_CORS_ORIGINS: https://web.example.com
      TRUSTED_HOSTS: api.example.com,web.example.com
      SERVER_HOST: https://api.example.com
      FRONTEND_URL: https://web.example.com
      WS_ALLOWED_ORIGINS: https://web.example.com
      NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
      NEXT_PUBLIC_WS_URL: wss://api.example.com
      NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
      - name: Build backend runtime image
        run: docker build -t ecommerce-backend:ci ./backend
      - name: Smoke test backend container
        run: |
          cid=$(docker run -d -p 8000:8000 -e DEBUG=True -e TESTING=True ecommerce-backend:ci)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/docs >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid"
          echo "Backend runtime container failed to become ready" >&2
          exit 1
      - name: Build frontend runtime image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg NEXT_PUBLIC_WS_URL="$NEXT_PUBLIC_WS_URL" \
            --build-arg NEXT_PUBLIC_ANALYTICS_ENABLED="$NEXT_PUBLIC_ANALYTICS_ENABLED" \
            -t ecommerce-frontend:ci ./frontend
      - name: Smoke test frontend container
        run: |
          cid=$(docker run -d -p 3000:3000 ecommerce-frontend:ci)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid"
          echo "Frontend runtime container failed to become ready" >&2
          exit 1

  mobile:
    runs-on: ubuntu-latest
    env:
      MOBILE_ANDROID_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mobile_android_release || 'false' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Android release signing preflight
        if: ${{ env.MOBILE_ANDROID_RELEASE == 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Missing required secret: ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          ./scripts/check_android_release_signing.sh --strict
      - name: Android signed release bundle validation
        if: ${{ env.MOBILE_ANDROID_RELEASE == 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --flavor production --release
